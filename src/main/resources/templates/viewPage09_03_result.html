<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>유형 유효성 검사 통과</title>
    <style>
        span{
            color: red;
            border: 1px dotted red;
        }
    </style>
</head>
<body>
<h3>유효성 검사 통과 결과</h3>
<p>회원 성명 : <span th:text="${person.name}"></span></p>
<p>회원 나이 : <span th:text="${person.age}"></span></p>
<p>회원 이메일 : <span th:text="${person.email}"></span></p>
</body>
</html>
